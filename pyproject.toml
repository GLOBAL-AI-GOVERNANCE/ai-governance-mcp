[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaig-mcp"
version = "0.3.1"
description = "AI Governance Model Context Protocol Server (AI Governance MCP): non-authorizing tools for Global AI Governance reference tooling (authority_effect NONE)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "mcp==2.3.0",
  "jsonschema==4.26.0",
  "cryptography==50.0.2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://ai-governance.solutions/connect.html"
Repository = "https://github.com/GLOBAL-AI-GOVERNANCE/ai-governance-mcp"
Documentation = "https://github.com/GLOBAL-AI-GOVERNANCE/ai-governance-mcp#readme"

[project.scripts]
gaig-mcp = "gaig_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gaig_mcp", "gaig_mcp.*"]

[tool.setuptools.package-data]
gaig_mcp = ["_upstream/**/*", "examples/*.csv"]

[tool.setuptools.exclude-package-data]
gaig_mcp = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
