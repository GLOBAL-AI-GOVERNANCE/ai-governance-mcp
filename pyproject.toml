[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gag-mcp"
version = "0.1.0"
description = "AI Governance Model Context Protocol Server (AI Governance MCP): non-authorizing tools for Global AI Governance reference tooling (authority_effect NONE)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp==2.3.0",
  "jsonschema==4.26.0",
  "cryptography==50.0.2",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/GLOBAL-AI-GOVERNANCE/ai-governance-mcp"

[project.scripts]
gag-mcp = "gag_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["gag_mcp", "gag_mcp.*"]

[tool.setuptools.package-data]
gag_mcp = ["_upstream/**/*"]

[tool.setuptools.exclude-package-data]
gag_mcp = ["**/__pycache__/*", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
