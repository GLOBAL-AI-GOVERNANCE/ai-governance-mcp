name: Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build; its release receives the assets unless publish_to is testpypi"
        required: true
      publish_to:
        description: "none: build, attest, and attach to the release. testpypi: build, attest, and upload to TestPyPI only (no release needed)."
        type: choice
        options:
          - none
          - testpypi
        default: none

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Require every schema $id to resolve to the document in this tag
        run: python -B scripts/check_schema_ids.py --online

      - name: Build wheel and sdist from the tag
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build==1.6.1
          python -m build --outdir "$RUNNER_TEMP/dist"
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$TAG"

      - name: Install the wheel into a clean virtual environment and run the examples
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/verify"
          "$RUNNER_TEMP/verify/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP"/dist/*.whl
          test "$("$RUNNER_TEMP/verify/bin/gaig-mcp" --version)" = "${TAG#v}"
          cp examples/agent-stacks/*.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/verify/bin/python" mcp_client_loop.py
          "$RUNNER_TEMP/verify/bin/python" passport_gate_graph.py

      - name: Generate CycloneDX SBOM from the clean install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/sbom-tool"
          "$RUNNER_TEMP/sbom-tool/bin/python" -m pip install --disable-pip-version-check cyclonedx-bom==7.5.0
          name=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])")
          "$RUNNER_TEMP/sbom-tool/bin/cyclonedx-py" environment \
            --pyproject pyproject.toml --sv 1.6 --of JSON \
            -o "$RUNNER_TEMP/dist/${name}-${TAG#v}.cdx.json" \
            "$RUNNER_TEMP/verify/bin/python"

      - name: Write SHA256SUMS
        shell: bash
        working-directory: ${{ runner.temp }}/dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error

  attest:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Check build output against SHA256SUMS
        shell: bash
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Attest build provenance for every release asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  attach:
    needs: [build, attest]
    if: inputs.publish_to != 'testpypi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Attach assets to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" dist/*

  # Publishing uses PyPI trusted publishing (OIDC); no API token is stored. Both jobs
  # stay skipped until the repository variable that enables them is set to "true",
  # which happens only after the matching GitHub environment and PyPI or TestPyPI
  # trusted publisher exist. Only the wheel and sdist are uploaded.
  publish:
    needs: [build, attest]
    if: >-
      github.event_name == 'release'
      && !github.event.release.prerelease
      && vars.PYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/gaig-mcp/
    permissions:
      id-token: write

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Keep only the wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          mkdir upload
          cp dist/*.whl dist/*.tar.gz upload/
          ls -l upload

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload/

  publish-testpypi:
    needs: [build, attest]
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.publish_to == 'testpypi'
      && vars.TESTPYPI_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/gaig-mcp/
    permissions:
      id-token: write

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Keep only the wheel and sdist
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          mkdir upload
          cp dist/*.whl dist/*.tar.gz upload/
          ls -l upload

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: upload/
