name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch pinned upstreams
        run: ./scripts/fetch_upstreams.sh
      - name: Check bundled upstreams match the source lock
        run: python scripts/bundle_upstreams.py --check
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Run the examples from a clean wheel install (no upstream checkout)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP"/dist/*.whl
          cp examples/agent-stacks/*.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" mcp_client_loop.py
          "$RUNNER_TEMP/clean/bin/python" passport_gate_graph.py
          "$RUNNER_TEMP/clean/bin/python" -c 'from gaig_mcp.core import check_inventory, minimal_inventory_csv; out = check_inventory(minimal_inventory_csv(), evaluation_time="2026-10-16T00:00:00Z"); assert out["result"]["validation_state"] == "VALID", out; print("packaged minimal inventory:", out["result"]["validation_state"], out["result"]["finding_count"])'
