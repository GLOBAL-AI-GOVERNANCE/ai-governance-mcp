name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Fetch pinned upstreams
        run: ./scripts/fetch_upstreams.sh
      - name: Check bundled upstreams match the source lock
        run: python scripts/bundle_upstreams.py --check
      - name: Check schema identifiers name their published release path
        run: python scripts/check_schema_ids.py
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: python -m pytest

  interop:
    # Runs the adapters against the real SDKs, offline (no model calls, no network services).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch pinned upstreams
        run: ./scripts/fetch_upstreams.sh
      - name: Install with pinned agent SDKs
        run: |
          python -m pip install --upgrade pip
          # crewai 1.15.33 depends on mcp<2; gaig-mcp pins mcp==2.3.0. Install the agent
          # SDKs first, then crewai, then restore mcp so both the real CrewAI hooks and
          # gaig-mcp stay importable for offline interop tests.
          pip install -e ".[dev]" a2a-sdk==1.2.3 opentelemetry-sdk==1.45.1 langgraph==1.2.17 openai-agents==0.24.0 claude-agent-sdk==0.2.174
          pip install crewai==1.15.33
          pip install "mcp==2.3.0"
      - name: Interop tests (no skips allowed)
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -rs tests/test_interop.py tests/test_guards.py tests/test_automated_approver.py tests/test_prompt_injection.py | tee interop.log
          ! grep -q "SKIPPED" interop.log

  first-run:
    name: First-run smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Documented first-run (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/mcp-venv"
          . "$RUNNER_TEMP/mcp-venv/bin/activate"
          python -m pip install --disable-pip-version-check .
          gaig-mcp --version
          python -c "from gaig_mcp.core import check_inventory; out=check_inventory(use_sample=True, evaluation_time='2026-10-16T00:00:00Z'); assert out['authority_effect']=='NONE'; assert out['human_decision_state']=='PENDING_HUMAN_DECISION'; assert out['tool']=='check_inventory'; r=out['result']; assert r['validation_state']=='VALID'; assert r['finding_count']==len(r['findings'])>0; assert r['findings_by_severity'].get('CRITICAL', 0)>=1; print(r['validation_state'], r['finding_count'])"
      - name: Documented first-run (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m venv "$env:RUNNER_TEMP\mcp-venv"
          & "$env:RUNNER_TEMP\mcp-venv\Scripts\Activate.ps1"
          python -m pip install --disable-pip-version-check .
          gaig-mcp --version
          if ($LASTEXITCODE -ne 0) { throw "gaig-mcp --version exited $LASTEXITCODE" }
          python -c "from gaig_mcp.core import check_inventory; out=check_inventory(use_sample=True, evaluation_time='2026-10-16T00:00:00Z'); assert out['authority_effect']=='NONE'; assert out['human_decision_state']=='PENDING_HUMAN_DECISION'; assert out['tool']=='check_inventory'; r=out['result']; assert r['validation_state']=='VALID'; assert r['finding_count']==len(r['findings'])>0; assert r['findings_by_severity'].get('CRITICAL', 0)>=1; print(r['validation_state'], r['finding_count'])"

  test:
    # Single required status check covering every supported Python version, interop, and first-run.
    needs: [tests, interop, first-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All supported Python versions, interop, and first-run passed
        env:
          RESULT: ${{ needs.tests.result }}
          INTEROP: ${{ needs.interop.result }}
          FIRST_RUN: ${{ needs.first-run.result }}
        run: test "$RESULT" = "success" && test "$INTEROP" = "success" && test "$FIRST_RUN" = "success"

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1
          python -m build --outdir "$RUNNER_TEMP/dist"
      - name: Run the examples from a clean wheel install (no upstream checkout)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install --disable-pip-version-check "$RUNNER_TEMP"/dist/*.whl
          cp examples/agent-stacks/*.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" mcp_client_loop.py
          "$RUNNER_TEMP/clean/bin/python" passport_gate_graph.py
          "$RUNNER_TEMP/clean/bin/python" -c 'from gaig_mcp.core import check_inventory, minimal_inventory_csv; out = check_inventory(minimal_inventory_csv(), evaluation_time="2026-10-16T00:00:00Z"); assert out["result"]["validation_state"] == "VALID", out; print("packaged minimal inventory:", out["result"]["validation_state"], out["result"]["finding_count"])'
